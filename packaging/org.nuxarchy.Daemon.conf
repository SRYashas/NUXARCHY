<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the Nuxarchy Daemon service -->
  <policy user="root">
    <allow own="org.nuxarchy.Daemon"/>
    <allow send_destination="org.nuxarchy.Daemon"/>
    <allow receive_sender="org.nuxarchy.Daemon"/>
  </policy>

  <!-- Allow all users on the system bus to interact with the daemon -->
  <policy context="default">
    <allow send_destination="org.nuxarchy.Daemon"/>
    <allow receive_sender="org.nuxarchy.Daemon"/>
  </policy>
</busconfig>
